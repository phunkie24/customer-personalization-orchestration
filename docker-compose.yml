version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: personalization-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: personalization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personalization-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: personalization-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: personalization-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: personalization-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Agent 1: Segmentation
  agent1-segmentation:
    build:
      context: .
      dockerfile: agent1-segmentation/Dockerfile
    container_name: agent1-segmentation
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data:ro
      - ./agent1-segmentation/models:/app/models
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/personalization
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Agent 2: Content Retrieval (RAG)
  agent2-content-retrieval:
    build:
      context: .
      dockerfile: agent2-content-retrieval/Dockerfile
    container_name: agent2-content-retrieval
    ports:
      - "5002:5002"
    volumes:
      - ./data:/app/data:ro
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Agent 3: Message Generation
  agent3-message-generation:
    build:
      context: .
      dockerfile: agent3-message-generation/Dockerfile
    container_name: agent3-message-generation
    ports:
      - "5003:5003"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=llama3
      - LOG_LEVEL=INFO
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Agent 4: Compliance
  agent4-compliance:
    build:
      context: .
      dockerfile: agent4-compliance/Dockerfile
    container_name: agent4-compliance
    ports:
      - "5004:5004"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Agent 5: Experiment Orchestrator
  agent5-experiment-orchestrator:
    build:
      context: .
      dockerfile: agent5-experiment-orchestrator/Dockerfile
    container_name: agent5-experiment-orchestrator
    ports:
      - "5005:5005"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/personalization
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Main Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: orchestrator
    ports:
      - "8000:8000"
    environment:
      - SEGMENTATION_URL=http://agent1-segmentation:5001
      - CONTENT_RETRIEVAL_URL=http://agent2-content-retrieval:5002
      - MESSAGE_GENERATION_URL=http://agent3-message-generation:5003
      - COMPLIANCE_URL=http://agent4-compliance:5004
      - EXPERIMENT_URL=http://agent5-experiment-orchestrator:5005
      - LOG_LEVEL=INFO
    depends_on:
      agent1-segmentation:
        condition: service_healthy
      agent2-content-retrieval:
        condition: service_healthy
      agent3-message-generation:
        condition: service_healthy
      agent4-compliance:
        condition: service_healthy
      agent5-experiment-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  ollama_data:

networks:
  default:
    name: personalization-network
